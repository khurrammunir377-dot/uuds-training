<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UUDS Training Compliance Tracker</title>
    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/assets/index-BAWqwbin.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-m9DaqNwn.css">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-blue-600 selection:text-white min-h-screen">
    <div id="root">
      <div id="initial-loader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#020617;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;padding:24px;text-align:center;">
        <div style="width:48px;height:48px;border:3px solid rgba(59,130,246,0.25);border-top-color:#38bdf8;border-radius:50%;animation:uuds-spin 0.8s linear infinite;margin-bottom:18px;"></div>
        <h3 style="margin:0 0 6px;font-size:16px;font-weight:800;letter-spacing:0.5px;color:#ffffff;">UUDS AERO</h3>
        <p style="margin:0;font-size:12px;color:#94a3b8;font-weight:500;letter-spacing:0.3px;">Loading Training Compliance System...</p>
        <style>@keyframes uuds-spin{to{transform:rotate(360deg)}}</style>
        <noscript>
          <p style="margin-top:16px;color:#ef4444;font-size:12px;">JavaScript is required to run the UUDS Training Tracker. Please enable JavaScript in your browser settings.</p>
        </noscript>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var loader = document.getElementById('initial-loader');
        if (loader && !window.__uuds_react_mounted) {
          loader.innerHTML = '<div style="max-width:420px;width:100%;background:#0f172a;border:1px solid rgba(239,68,68,0.4);border-radius:20px;padding:24px;box-shadow:0 20px 40px rgba(0,0,0,0.6);text-align:center;">' +
            '<div style="width:44px;height:44px;border-radius:14px;background:rgba(239,68,68,0.15);color:#f87171;display:inline-flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px;">!</div>' +
            '<h3 style="margin:0 0 8px;font-size:16px;font-weight:700;color:#ffffff;">Display Refresh Required</h3>' +
            '<p style="margin:0 0 16px;font-size:12px;color:#94a3b8;line-height:1.5;">Your browser is loading updated application files. Click below to refresh cleanly.</p>' +
            '<button onclick="localStorage.clear();sessionStorage.clear();window.location.reload(true);" style="padding:10px 20px;background:#2563eb;color:#ffffff;border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;">Clear Cache & Reload</button>' +
            '</div>';
        }
      });
    </script>
  </body>
</html>
